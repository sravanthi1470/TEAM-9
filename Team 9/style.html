<!DOCTYPE html>
<html>
<head>
    <title>Find My Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Select Your Preferences</h2>

<div class="form-box">

<label>Gender</label>
<select id="gender">
    <option>Male</option>
    <option>Female</option>
</select>

<label>Occasion</label>
<select id="occasion">
    <option>College</option>
    <option>Party</option>
    <option>Wedding</option>
    <option>Casual</option>
</select>

<label>Color Preference</label>
<select id="color">
    <option>Dark</option>
    <option>Light</option>
    <option>Bright</option>
</select>

<button onclick="suggest()">Show My Outfit</button>

</div>

<script src="script.js"></script>

</body>
</html>
